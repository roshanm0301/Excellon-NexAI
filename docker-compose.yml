version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexai
      POSTGRES_USER: nexai
      POSTGRES_PASSWORD: nexai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    command: ["-path=/migrations", "-database=postgres://nexai:nexai@postgres:5432/nexai?sslmode=disable", "up"]

  decision-service:
    build:
      context: ./docs-pack/Workflow-Rule-Requirements/editor-master
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CORS_PERMISSIVE: "1"
    ports:
      - "3001:3000"

  api:
    build:
      context: ./src/go
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      decision-service:
        condition: service_started
    environment:
      DATABASE_URL: postgres://nexai:nexai@postgres:5432/nexai?sslmode=disable
      REDIS_URL: redis://redis:6379
      ZEN_DECISION_URL: http://decision-service:3000
      PORT: "8080"
      LOG_LEVEL: info
    ports:
      - "9080:8080"

  studio:
    build:
      context: ./src/react
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  pgdata:
