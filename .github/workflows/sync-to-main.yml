name: Sync claude branch to main

on:
  workflow_run:
    workflows:
      - Deploy to Vercel
    types:
      - completed
    branches:
      - claude/exciting-keller-ZhAFS

jobs:
  sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge feature branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main
          git merge --ff-only origin/claude/exciting-keller-ZhAFS || git merge -X theirs origin/claude/exciting-keller-ZhAFS
          git push origin main
