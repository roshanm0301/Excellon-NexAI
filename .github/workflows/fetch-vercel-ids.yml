name: Fetch Vercel IDs (one-time setup)

on:
  workflow_dispatch:

jobs:
  fetch-ids:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI and fetch IDs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest --silent

          echo "========================================"
          echo "VERCEL_ORG_ID:"
          vercel whoami --token "$VERCEL_TOKEN" --scope team 2>/dev/null || true
          curl -s https://api.vercel.com/v2/user \
            -H "Authorization: Bearer $VERCEL_TOKEN" | python3 -m json.tool

          echo "========================================"
          echo "VERCEL_PROJECT_ID:"
          curl -s "https://api.vercel.com/v9/projects" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | python3 -c "
import sys, json
data = json.load(sys.stdin)
projects = data.get('projects', [])
if not projects:
    print('No projects found. Make sure you created a project on Vercel.')
for p in projects:
    print(f\"  Project name : {p['name']}\")
    print(f\"  Project ID   : {p['id']}\")
    print(f\"  Org/Account  : {p.get('accountId', 'n/a')}\")
    print()
"
