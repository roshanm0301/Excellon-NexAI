name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - claude/exciting-keller-ZhAFS
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy React app to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_DxCwvHD5aDLjvdLkKc6qyFK0
      VERCEL_PROJECT_ID: prj_fs6owHfBqr17Eusgn8EgZSgnVkH2
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/react/package-lock.json

      - name: Install dependencies
        working-directory: src/react
        run: npm ci

      - name: Build
        working-directory: src/react
        run: npm run build
        env:
          VITE_MSW: 'true'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Create Vercel Build Output structure
        run: |
          mkdir -p src/react/.vercel/output/static
          cp -r src/react/dist/. src/react/.vercel/output/static/
          cat > src/react/.vercel/output/config.json << 'EOF'
          {"version":3,"routes":[{"src":"/(.*)\\.(.+)","dest":"/$1.$2"},{"src":"(.*)","dest":"/index.html"}]}
          EOF

      - name: Deploy prebuilt to Vercel
        working-directory: src/react
        run: vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN
