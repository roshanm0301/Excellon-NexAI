name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - claude/exciting-keller-ZhAFS
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy React app to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/react/package-lock.json

      - name: Install dependencies
        working-directory: src/react
        run: npm ci

      - name: Build
        working-directory: src/react
        run: npm run build
        env:
          VITE_MSW: 'true'

      - name: Deploy dist to Vercel
        working-directory: src/react
        run: npx vercel deploy ./dist --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
