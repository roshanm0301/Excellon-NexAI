name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - claude/exciting-keller-ZhAFS
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy React app to Vercel
    runs-on: ubuntu-latest
    env:
      # Project IDs are not sensitive - only VERCEL_TOKEN is secret
      VERCEL_ORG_ID: team_DxCwvHD5aDLjvdLkKc6qyFK0
      VERCEL_PROJECT_ID: prj_fs6owHfBqr17Eusgn8EgZSgnVkH2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/react/package-lock.json

      - name: Install dependencies
        working-directory: src/react
        run: npm ci

      - name: Build
        working-directory: src/react
        run: npm run build
        env:
          VITE_MSW: 'true'

      - name: Prepare Vercel Build Output (v3)
        working-directory: src/react
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/
          cat > .vercel/output/config.json << 'VCONFIG'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          VCONFIG

      - name: Deploy prebuilt output to Vercel
        working-directory: src/react
        run: npx vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
