name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - claude/exciting-keller-ZhAFS
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy React app to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_fs6owHfBqr17Eusgn8EgZSgnVkH2
      VERCEL_TEAM_ID: team_DxCwvHD5aDLjvdLkKc6qyFK0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/react/package-lock.json

      - name: Install dependencies
        working-directory: src/react
        run: npm ci

      - name: Build
        working-directory: src/react
        run: npm run build
        env:
          VITE_MSW: 'true'
          VITE_BASE_PATH: '/'

      - name: Deploy via Vercel REST API
        run: |
          python3 << 'PYEOF'
          import os, hashlib, json, urllib.request, urllib.error
          from pathlib import Path

          TOKEN      = os.environ['VERCEL_TOKEN']
          PROJECT_ID = os.environ['VERCEL_PROJECT_ID']
          TEAM_ID    = os.environ['VERCEL_TEAM_ID']
          DIST       = Path('src/react/dist')

          def api(method, path, body=None, extra_headers=None):
              url = f'https://api.vercel.com{path}?teamId={TEAM_ID}'
              headers = {'Authorization': f'Bearer {TOKEN}'}
              if extra_headers:
                  headers.update(extra_headers)
              data = None
              if body is not None:
                  if isinstance(body, (bytes, bytearray)):
                      data = body
                  else:
                      data = json.dumps(body).encode()
                      headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  body_text = e.read().decode()
                  if e.code == 409:
                      return {'already': True}
                  raise Exception(f'HTTP {e.code}: {body_text}')

          # Collect and upload files
          files_payload = []
          all_files = [p for p in DIST.rglob('*') if p.is_file()]
          print(f'Uploading {len(all_files)} files...')

          for path in all_files:
              data  = path.read_bytes()
              sha   = hashlib.sha1(data).hexdigest()
              rel   = str(path.relative_to(DIST))
              api('POST', '/v2/files', body=data, extra_headers={
                  'x-vercel-digest': sha,
                  'Content-Length': str(len(data)),
                  'Content-Type': 'application/octet-stream'
              })
              files_payload.append({'file': rel, 'sha': sha, 'size': len(data)})

          print(f'Uploaded {len(files_payload)} files. Creating deployment...')

          result = api('POST', f'/v13/deployments?projectId={PROJECT_ID}', body={
              'name': 'excellon-nex-ai',
              'target': 'production',
              'files': files_payload,
              'projectSettings': {'framework': None, 'buildCommand': None, 'outputDirectory': None},
              'routes': [
                  {'src': '/assets/(.*)', 'dest': '/assets/$1'},
                  {'src': '/(.*)\\.(.+)', 'dest': '/$1.$2'},
                  {'src': '(.*)', 'dest': '/index.html'}
              ]
          })

          url  = result.get('url', '')
          state = result.get('readyState', result.get('status', ''))
          print(f'Deployment created: https://{url}')
          print(f'State: {state}')
          if not url:
              print('ERROR: no URL in response:', json.dumps(result, indent=2))
              exit(1)
          PYEOF
