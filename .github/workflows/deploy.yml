name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - claude/exciting-keller-ZhAFS
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy React app to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_DxCwvHD5aDLjvdLkKc6qyFK0
      VERCEL_PROJECT_ID: prj_fs6owHfBqr17Eusgn8EgZSgnVkH2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/react/package-lock.json

      - name: Install dependencies
        working-directory: src/react
        run: npm ci

      - name: Build
        working-directory: src/react
        run: npm run build
        env:
          VITE_MSW: 'true'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Debug and Deploy
        working-directory: src/react
        run: |
          set -x
          echo "--- Vercel version ---"
          vercel --version

          echo "--- Checking env vars ---"
          echo "VERCEL_ORG_ID=$VERCEL_ORG_ID"
          echo "VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID"

          echo "--- Config project via API ---"
          curl -sf -X PATCH \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory":"src/react","buildCommand":"npm run build","outputDirectory":"dist","framework":"vite"}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Project updated:', d.get('name','error'), d.get('error','ok'))" \
            || echo "API config step failed (non-fatal)"

          echo "--- Adding VITE_MSW env var ---"
          curl -sf -X POST \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '[{"key":"VITE_MSW","value":"true","type":"plain","target":["production","preview"]}]' \
            || echo "Env var step failed (non-fatal, may already exist)"

          echo "--- Deploying ---"
          vercel deploy ./dist --prod --yes --token=$VERCEL_TOKEN 2>&1 | tee /tmp/vercel-output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          echo "--- Vercel output ---"
          cat /tmp/vercel-output.txt
          exit $EXIT_CODE
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Upload deploy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-log
          path: /tmp/vercel-output.txt
