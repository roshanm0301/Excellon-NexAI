name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - claude/exciting-keller-ZhAFS
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy React app to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_DxCwvHD5aDLjvdLkKc6qyFK0
      VERCEL_PROJECT_ID: prj_fs6owHfBqr17Eusgn8EgZSgnVkH2
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/react/package-lock.json

      - name: Install dependencies
        working-directory: src/react
        run: npm ci

      - name: Build
        working-directory: src/react
        run: npm run build
        env:
          VITE_MSW: 'true'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Clear Vercel rootDirectory (causes path conflict with pre-built deploy)
        run: |
          curl -sf -X PATCH \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory":null,"outputDirectory":"src/react/dist","buildCommand":"echo skip"}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Updated:', d.get('name','error'))"

      - name: Deploy to Vercel
        run: vercel deploy ./src/react/dist --prod --yes --token=$VERCEL_TOKEN
