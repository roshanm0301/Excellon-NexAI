name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - claude/exciting-keller-ZhAFS
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy React app to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_DxCwvHD5aDLjvdLkKc6qyFK0
      VERCEL_PROJECT_ID: prj_fs6owHfBqr17Eusgn8EgZSgnVkH2
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/react/package-lock.json

      - name: Install dependencies
        working-directory: src/react
        run: npm ci

      - name: Build
        working-directory: src/react
        run: npm run build
        env:
          VITE_MSW: 'true'
          VITE_BASE_PATH: '/'

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la src/react/dist/
          echo "=== index.html head ==="
          head -5 src/react/dist/index.html

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Verify token and project
        run: |
          echo "=== Token check ==="
          curl -s "https://api.vercel.com/v2/user" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('User:', d.get('user',{}).get('email', d.get('error','AUTH FAILED')))"
          echo "=== Project check ==="
          curl -s "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Project:', d.get('name', d.get('error','NOT FOUND')))"

      - name: Fix Vercel project settings (clear rootDirectory)
        run: |
          RESULT=$(curl -s -X PATCH "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory":null,"outputDirectory":"dist","buildCommand":"npm run build","installCommand":"npm ci","framework":"vite"}')
          echo "API response: $(echo $RESULT | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"name\", d.get(\"error\",\"unknown\")))')"

      - name: Set Vercel env vars
        run: |
          curl -s -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d '{"key":"VITE_MSW","value":"true","type":"plain","target":["production"]}' > /dev/null
          curl -s -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d '{"key":"VITE_BASE_PATH","value":"/","type":"plain","target":["production"]}' > /dev/null
          echo "Env vars set"

      - name: Write project.json
        run: |
          mkdir -p src/react/.vercel
          echo '{"projectId":"prj_fs6owHfBqr17Eusgn8EgZSgnVkH2","orgId":"team_DxCwvHD5aDLjvdLkKc6qyFK0"}' \
            > src/react/.vercel/project.json

      - name: Deploy to Vercel
        working-directory: src/react
        run: vercel --prod --yes --token=$VERCEL_TOKEN
