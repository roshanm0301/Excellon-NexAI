name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - claude/exciting-keller-ZhAFS
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy React app to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_DxCwvHD5aDLjvdLkKc6qyFK0
      VERCEL_PROJECT_ID: prj_fs6owHfBqr17Eusgn8EgZSgnVkH2
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Configure Vercel project settings
        run: |
          # Set rootDirectory, build command, output dir, framework
          curl -sf -X PATCH "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "rootDirectory": "src/react",
              "buildCommand": "vite build",
              "outputDirectory": "dist",
              "installCommand": "npm ci",
              "framework": "vite"
            }' | python3 -c "import sys,json; d=json.load(sys.stdin); print('Configured:', d.get('name','error'))"

      - name: Set Vercel environment variables
        run: |
          # VITE_MSW enables mock API (no backend needed)
          curl -s -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"key":"VITE_MSW","value":"true","type":"plain","target":["production","preview"]}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('VITE_MSW:', d.get('key', d.get('error','?')))"
          # VITE_BASE_PATH=/ for Vercel (not /Excellon-NexAI/ which is GitHub Pages only)
          curl -s -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"key":"VITE_BASE_PATH","value":"/","type":"plain","target":["production","preview"]}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('VITE_BASE_PATH:', d.get('key', d.get('error','?')))"

      - name: Write Vercel project.json
        run: |
          mkdir -p src/react/.vercel
          echo '{"projectId":"prj_fs6owHfBqr17Eusgn8EgZSgnVkH2","orgId":"team_DxCwvHD5aDLjvdLkKc6qyFK0"}' \
            > src/react/.vercel/project.json

      - name: Deploy to Vercel (Vercel builds from source)
        working-directory: src/react
        run: vercel --prod --yes --token=$VERCEL_TOKEN
